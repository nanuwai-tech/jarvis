[project]
name = "jarvis"
version = "0.1.0"
description = "Jarvis - Real-time Multimodal Voice AI Assistant with LiveKit and Gemini Live"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "livekit-agents[images]>=0.10.0",
    "livekit-plugins-google>=0.8.0",
    "langchain-community>=0.2.0",
    "duckduckgo-search>=6.0.0",
    "playwright>=1.40.0",
    "python-dotenv>=1.0.0",
    "livekit-plugins-openai>=1.8.3",
    "livekit-plugins-silero>=1.8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["source"]
